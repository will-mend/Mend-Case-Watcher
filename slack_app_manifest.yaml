display_information:
  name: Mend Case Watcher - YOUR NAME HERE
  description: Personal Salesforce case management bot for Mend support engineers.
  background_color: "#1d2951"

features:
  app_home:
    home_tab_enabled: false
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
  bot_user:
    display_name: Mend Case Watcher - YOUR NAME HERE
    always_online: true

oauth_config:
  scopes:
    bot:
      - chat:write
      - im:write
      - im:history
      - users:read

settings:
  event_subscriptions:
    bot_events:
      - message.im
  interactivity:
    is_enabled: false
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
